<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Η σελίδα δεν βρέθηκε | 12358 Μελέτη - Κατασκευή Κτιρίων</title>
<script id="theme-init">(function(){try{var t=localStorage.getItem("12358-theme");if(t==="light"){document.documentElement.setAttribute("data-theme","light");}else if(t==="dark"){document.documentElement.removeAttribute("data-theme");}}catch(e){}})();</script>
<style>
:root{--bg:#1e1e1e;--text:#e0e0e0;--muted:#a0a0a0;--accent:#069494;}
html[data-theme="light"]{--bg:#ffffff;--text:#1e1e1e;--muted:#55635f;--accent:#05706f;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:var(--bg);color:var(--text);text-align:center;padding:2rem;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
main{max-width:34rem}
.code{margin:0;font-size:clamp(4rem,16vw,8rem);line-height:1;font-weight:700;
color:var(--accent);letter-spacing:-.03em}
h1{margin:1.2rem 0 .6rem;font-size:clamp(1.1rem,3.4vw,1.5rem);font-weight:500}
p{margin:0 0 2.2rem;color:var(--muted);font-size:.95rem;line-height:1.6}
a{display:inline-block;padding:.7rem 1.7rem;border:1px solid var(--accent);border-radius:999px;
color:var(--accent);text-decoration:none;font-size:.95rem;
transition:background-color .2s ease,color .2s ease}
a:hover,a:focus-visible{background:var(--accent);color:var(--bg);outline:none}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<h1>Η σελίδα δεν βρέθηκε</h1>
<p>Η διεύθυνση που ζητήσατε δεν υπάρχει ή έχει μετακινηθεί.</p>
<a href="/">Αρχική</a>
</main>
</body>
</html>
